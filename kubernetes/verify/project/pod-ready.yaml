apiVersion: v1
kind: Pod
metadata:
  name: ready
  labels:
    app: ready
spec:
  containers:
    - name: app
      image: alpine:3.22
      command: ["sleep", "3600"]
      readinessProbe:
        exec:
          command: ["test", "-f", "/tmp/ready"]
        periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: ready
spec:
  selector:
    app: ready
  ports:
    - port: 80
