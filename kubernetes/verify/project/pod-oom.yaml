apiVersion: v1
kind: Pod
metadata:
  name: oom
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: python:3.13-slim
      command: ["python", "-c", "x = bytearray(200 * 1024 * 1024); print('allocated', len(x) // 1048576, 'MB')"]
      resources:
        limits:
          memory: 64Mi
