apiVersion: v1
kind: Pod
metadata:
  name: live
spec:
  containers:
    - name: app
      image: alpine:3.22
      command: ["sh", "-c", "touch /tmp/alive; sleep 8; rm /tmp/alive; sleep 3600"]
      livenessProbe:
        exec:
          command: ["test", "-f", "/tmp/alive"]
        initialDelaySeconds: 2
        periodSeconds: 2
        failureThreshold: 2
