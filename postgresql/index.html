  <meta name="description" content="A guided, press-Next course on PostgreSQL for data engineers: the server and its files, row versions and vacuum, the write-ahead log and crash recovery, loading with COPY and idempotent upserts, indexes and statistics for big tables, partitions and retention, replication and change data capture, backups and point-in-time recovery, and roles and settings. Every output was recorded from real PostgreSQL 16 servers. Managed services and extensions beyond the contrib set did not run, and every screen says which is which.">
