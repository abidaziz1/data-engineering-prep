# The settings that the course changes or reads. Everything else stays at its default.
wal_level = replica               # logical when a subscriber or Debezium reads the changes
max_wal_size = 1GB
archive_mode = on
archive_command = 'cp %p /archive/%f'
max_slot_wal_keep_size = 50GB     # a slot that nobody reads cannot fill the disk
hot_standby_feedback = off
idle_in_transaction_session_timeout = '10min'
log_min_duration_statement = '1s'
shared_preload_libraries = 'pg_stat_statements'
