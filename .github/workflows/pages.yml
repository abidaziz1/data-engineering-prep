name: Deploy to GitHub Pages

# Publishes the library when it is started by hand: open the Actions tab, choose this workflow, and press "Run workflow".
# It is the way to publish when Settings, Pages, Source is "GitHub Actions".
# When the Source is "Deploy from a branch", GitHub publishes every push by itself (the workflow "pages build and deployment"),
# and running this workflow on every push as well made one of the two fail now and then, with "No artifacts named github-pages were found".
# To publish on every push with the Actions source, add this under "on:":
#   push:
#     branches: [claude/snowflake-tutorial, main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the site files
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'dev' --exclude 'verify' --exclude '__pycache__' --exclude 'node_modules' --exclude '_site' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
