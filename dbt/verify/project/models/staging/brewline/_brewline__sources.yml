version: 2

sources:
  - name: brewline
    description: Raw tables loaded by the ingestion pipeline. Nothing here is cleaned.
    schema: raw
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: orders
        description: One row for every version of an order. The loader only appends.
        columns:
          - name: order_id
            description: Business key. It repeats here because RAW keeps every version.
      - name: order_items
        description: One row for every line of an order.
      - name: customers
        description: One row for every customer, as last loaded.
      - name: products
        description: The product catalog.
