# The release checks of an AI assistant. This file is an example for the course. It is kept outside .github/workflows on purpose, so it never runs.
name: assistant-release-checks

on:
  pull_request:
    paths:
      - 'prompts/**'
      - 'retrieval/**'
      - 'tools/**'
      - 'evals/**'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Tests of the loop, with a scripted model
        run: python -m pytest -q tests/test_agent.py

  evaluation:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Offline evaluation on the golden set, compared with the current release
        run: python evals/gate.py --candidate build/candidate --baseline releases/current --fail-on-regression
      - name: Attack set
        run: python evals/attacks.py --must-pass-all
